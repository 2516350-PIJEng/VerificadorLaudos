# Blueprint opcional do Render (Infrastructure as Code)
services:
  - type: web
    name: verificador-laudo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MOCK_EMAIL
        value: "true"
